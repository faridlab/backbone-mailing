components:
  schemas:
    MailingAbTest:
      type: object
      required:
        - id
        - campaign_id
        - winner_selection
        - completed
        - sampling_seed
        - metadata
      properties:
        id:
          type: string
          format: uuid
        campaign_id:
          type: string
          format: uuid
        winner_selection:
          type: string
        promote_at:
          nullable: true
          type: string
          format: date-time
        completed:
          type: boolean
        winner_mailing_id:
          nullable: true
          type: string
          format: uuid
        sampling_seed:
          type: string
          maxLength: 64
        metadata:
          type: object

    MailingAbTestBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MailingAbTest'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateMailingAbTestRequest:
      type: object
      required:
        - campaign_id
        - winner_selection
        - completed
        - sampling_seed
        - metadata
      properties:
        campaign_id:
          type: string
          format: uuid
        winner_selection:
          type: string
        promote_at:
          nullable: true
          type: string
          format: date-time
        completed:
          type: boolean
        winner_mailing_id:
          nullable: true
          type: string
          format: uuid
        sampling_seed:
          type: string
          maxLength: 64
        metadata:
          type: object

    UpdateMailingAbTestRequest:
      type: object
      required:
        - campaign_id
        - winner_selection
        - completed
        - sampling_seed
        - metadata
      properties:
        campaign_id:
          type: string
          format: uuid
        winner_selection:
